<!-- Skript zum dynamischen Laden des Event-Moduls -->
    <script>
        fetch('components/event-card.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Datei nicht gefunden (404)');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('event-module').innerHTML = data;
            })
            .catch(error => {
                console.error(error);
                document.getElementById('event-module').innerHTML = '<p style="color: #ef4444; text-align: center;">Das Event-Modul konnte nicht geladen werden.</p>';
            });
    </script>
