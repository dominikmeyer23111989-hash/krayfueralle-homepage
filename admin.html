<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrayFürAlle e.V. – Redaktions-Login & Admin</title>
    <link rel="icon" href="data:,">
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #334155; margin: 0; padding: 0; line-height: 1.6; }

        .container { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 2.5rem; border: 1px solid var(--border-color); box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        
        h1 { font-size: 1.8rem; color: var(--text-main); margin-top: 0; margin-bottom: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem; }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); font-size: 0.95rem; }
        input[type="email"], input[type="password"], input[type="text"], textarea {
            width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-family: inherit; background: #fff;
        }
        textarea { resize: vertical; min-height: 150px; }
        
        .btn { padding: 0.85rem 1.75rem; border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s ease; border: none; cursor: pointer; font-size: 1rem; width: 100%; }
        .btn-primary { background: var(--primary-color); color: #ffffff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: #ef4444; color: #fff; width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-danger:hover { background: #dc2626; }

        .hidden { display: none !important; }
        
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.95rem; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Card -->
        <div id="loginCard" class="card">
            <h1><i class="fa-solid fa-lock" style="color: var(--primary-color);"></i> Redaktions-Login</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Bitte logge dich mit deinen Zugangsdaten ein, um Berichte zu verfassen.</p>
            
            <div id="loginError" class="alert alert-error hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" required placeholder="deine.email@verein.de">
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Einloggen</button>
            </form>
        </div>

        <!-- Admin Form Card (Standardmäßig versteckt) -->
        <div id="adminCard" class="card hidden">
            <div class="header-bar">
                <h1><i class="fa-solid fa-pen-to-square" style="color: var(--primary-color);"></i> Neuen Beitrag erstellen</h1>
                <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Abmelden</button>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Der Beitrag wird nach dem Absenden sofort auf der Startseite im Bereich „Aktuelles“ veröffentlicht.</p>
            
            <div id="formAlert" class="alert hidden"></div>

            <form id="newsForm">
                <div class="form-group">
                    <label for="newsTitle">Titel des Beitrags</label>
                    <input type="text" id="newsTitle" required placeholder="Z. B. Erfolgreiches Nachbarschaftsfest im Park">
                </div>
                <div class="form-group">
                    <label for="newsAuthor">Autor / Verantwortlich</label>
                    <input type="text" id="newsAuthor" required placeholder="Z. B. Vorstand KrayFürAlle e.V.">
                </div>
                <div class="form-group">
                    <label for="newsImage">Bild (optional)</label>
                    <input type="file" id="newsImage" accept="image/*" style="padding: 0.5rem 0;">
                    <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">Wähle ein passendes Foto von deinem Gerät aus.</small>
                </div>
                <div class="form-group">
                    <label for="newsContent">Inhalt / Text</label>
                    <textarea id="newsContent" required placeholder="Schreibe hier deinen Bericht..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Beitrag veröffentlichen</button>
            </form>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Zurück zur Startseite</a>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://ythubjdnercyeyfedsam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHViamRuZXJjeWV5ZmVkc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjgzNTgsImV4cCI6MjA5OTEwNDM1OH0.loeU2abylobRmPJvuHwdZLbHNyTL4qlKOtIRk-qZp34';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginCard = document.getElementById('loginCard');
        const adminCard = document.getElementById('adminCard');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const newsForm = document.getElementById('newsForm');
        const formAlert = document.getElementById('formAlert');
        const submitBtn = document.getElementById('submitBtn');

        // Prüfen, ob bereits eingeloggt
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                loginCard.classList.add('hidden');
                adminCard.classList.remove('hidden');
            } else {
                loginCard.classList.remove('hidden');
                adminCard.classList.add('hidden');
            }
        }

        checkSession();

        // Login verarbeiten
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                loginError.textContent = 'Login fehlgeschlagen: ' + error.message;
                loginError.classList.remove('hidden');
            } else {
                checkSession();
            }
        });

        // Logout verarbeiten
        logoutBtn.addEventListener('click', async function() {
            await supabaseClient.auth.signOut();
            checkSession();
        });

        // Beitrag absenden und in Supabase speichern
        newsForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Wird veröffentlicht...';
            formAlert.classList.add('hidden');

            const title = document.getElementById('newsTitle').value;
            const author = document.getElementById('newsAuthor').value;
            const content = document.getElementById('newsContent').value;
            const imageFile = document.getElementById('newsImage').files[0];

            let imageUrl = '';

            try {
                // Falls ein Bild ausgewählt wurde, in Supabase Storage hochladen
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from('news-images')
                        .upload(filePath, imageFile);

                    if (uploadError) throw uploadError;

                    // Öffentliche URL des Bildes abrufen
                    const { data: publicURLData } = supabaseClient.storage
                        .from('news-images')
                        .getPublicUrl(filePath);

                    imageUrl = publicURLData.publicUrl;
                }

                // In die Tabelle 'aktuelles' einfügen
                const { error: insertError } = await supabaseClient
                    .from('aktuelles')
                    .insert([
                        { titel: title, inhalt: content, autor: author, bild_url: imageUrl }
                    ]);

                if (insertError) throw insertError;

                formAlert.textContent = 'Beitrag erfolgreich veröffentlicht!';
                formAlert.className = 'alert alert-success';
                formAlert.classList.remove('hidden');
                newsForm.reset();

            } catch (err) {
                formAlert.textContent = 'Fehler beim Veröffentlichen: ' + err.message;
                formAlert.className = 'alert alert-error';
                formAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Beitrag veröffentlichen';
            }
        });
    </script>
</body>
</html>
