<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termine & Buchungsanfragen – KrayFürAlle e.V.</title>
    <link rel="icon" href="data:,">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #334155; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        
        .header-title { font-size: 2.2rem; color: var(--text-main); margin-bottom: 0.5rem; font-weight: 700; }
        .header-subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem; }

        .card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 2rem; }
        
        /* FullCalendar Custom Styling */
        .fc { font-family: 'Inter', sans-serif; }
        .fc-toolbar-title { font-size: 1.3rem !important; font-weight: 600; color: var(--text-main); }
        .fc-button-primary { background-color: var(--primary-color) !important; border-color: var(--primary-color) !important; border-radius: 8px !important; }
        .fc-button-primary:hover { background-color: var(--primary-hover) !important; }
        .fc-daygrid-day { cursor: pointer; }
        .fc-daygrid-day:hover { background-color: #f1f5f9; }

        /* Formular Styling */
        .btn-primary { background: var(--primary-color); color: #fff; padding: 0.85rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; transition: background 0.2s; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }

        .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1rem; }
        .form-group label { font-weight: 500; font-size: 0.9rem; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-color); }
        
        .selected-date-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: #e0e7ff; color: #3730a3; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <!-- Header-Modul -->
    <div data-include="components/navbar.html"></div>

    <main class="container">
        <h1 class="header-title">Belegungsplan & Anfragen</h1>
        <p class="header-subtitle">Klicke auf einen Tag im Kalender, um ein Wunschdatum auszuwählen oder auf ein Event, um eine Teilnahme anzufreggen.</p>

        <!-- 1. Interaktiver Kalender -->
        <div class="card">
            <h3 style="font-size: 1.3rem; color: var(--text-main); margin-top: 0; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-calendar-days" style="color: var(--primary-color); margin-right: 0.5rem;"></i>
                Kalender & Vereins-Termine
            </h3>
            <div id="calendar"></div>
        </div>

        <!-- 2. Buchungs- & Anfrageformular -->
        <div class="card" id="booking-section">
            <h3 style="font-size: 1.3rem; color: var(--text-main); margin-top: 0; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-paper-plane" style="color: var(--primary-color); margin-right: 0.5rem;"></i>
                Anfrage senden
            </h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Wähle oben im Kalender dein Wunschdatum aus oder trage es hier direkt ein.</p>

            <div id="selectedDateBadge" class="selected-date-badge" style="display: none;">
                <i class="fa-solid fa-calendar-check"></i> <span>Ausgewähltes Datum / Event: <strong id="badgeDateText">-</strong></span>
            </div>

            <form id="eventBookingForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label for="bookingType">Art der Anfrage:</label>
                        <select id="bookingType" name="bookingType" required>
                            <option value="Vereinsbuchung / Veranstalter">Verein / Räume buchen (Veranstalter)</option>
                            <option value="Teilnahme an Veranstaltung">Teilnahme an angezeigtem Event</option>
                            <option value="Allgemeine Anfrage">Allgemeine Terminanfrage</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="requestDate">Gewünschtes Datum:</label>
                        <input type="date" id="requestDate" name="requestDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventTitleInput">Veranstaltungsname / Anlass (optional):</label>
                    <input type="text" id="eventTitleInput" name="eventTitleInput" placeholder="z. B. Workshop, Stadtteiltreff, Private Nutzung">
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label for="userName">Dein Name / Ansprechpartner:</label>
                        <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Max Mustermann" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">E-Mail-Adresse:</label>
                        <input type="email" id="userEmail" name="userEmail" autocomplete="email" placeholder="max@example.de" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="ticketCount">Personenanzahl:</label>
                        <input type="number" id="ticketCount" name="ticketCount" autocomplete="off" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="userNotes">Anmerkungen / Details zur Anfrage:</label>
                        <input type="text" id="userNotes" name="userNotes" autocomplete="off" placeholder="z. B. Benötigte Technik, Uhrzeit, besondere Wünsche">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">
                    <i class="fa-solid fa-paper-plane"></i> Anfrage kostenfrei absenden
                </button>
            </form>
        </div>
    </main>

    <!-- Footer-Modul -->
    <div data-include="components/footer.html"></div>

    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="js/include.js"></script>

    <script>
        const SUPABASE_URL = 'https://ythubjdnercyeyfedsam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHViamRuZXJjeWV5ZmVkc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjgzNTgsImV4cCI6MjA5OTEwNDM1OH0.loeU2abylobRmPJvuHwdZLbHNyTL4qlKOtIRk-qZp34';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', async function() {
            let calendarEvents = [];

            // 1. Daten aus Tabelle "events" laden (Spalten: name, start_datum, ort etc.)
            try {
                const { data: eventsData, error: eventsError } = await supabaseClient
                    .from('events')
                    .select('*');
                
                if (!eventsError && eventsData) {
                    const mappedEvents = eventsData.map(evt => ({
                        title: evt.name || 'Veranstaltung',
                        start: evt.start_datum,
                        color: '#2563eb', // Blau für Events
                        extendedProps: {
                            ort: evt.ort,
                            beschreibung: evt.bemerkungen
                        }
                    }));
                    calendarEvents = calendarEvents.concat(mappedEvents);
                } else {
                    console.log("Fehler beim Laden von 'events':", eventsError);
                }
            } catch (e) {
                console.log("Tabelle 'events' konnte nicht geladen werden:", e);
            }

            // 2. Daten aus Tabelle "termine" laden (Spalten: titel, datum, beschreibung etc.)
            try {
                const { data: termineData, error: termineError } = await supabaseClient
                    .from('termine')
                    .select('*');
                
                if (!termineError && termineData) {
                    const mappedTermine = termineData.map(term => ({
                        title: term.titel || 'Termin',
                        start: term.datum,
                        color: '#0d9488', // Türkis für Termine
                        extendedProps: {
                            ort: term.ort,
                            beschreibung: term.beschreibung
                        }
                    }));
                    calendarEvents = calendarEvents.concat(mappedTermine);
                } else {
                    console.log("Fehler beim Laden von 'termine':", termineError);
                }
            } catch (e) {
                console.log("Tabelle 'termine' konnte nicht geladen werden:", e);
            }

            // 3. FullCalendar Initialisieren
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'de',
                buttonText: { today: 'Heute' },
                events: calendarEvents,
                
                // Klick auf ein freies Datum (für Veranstalter / Vermietung)
                dateClick: function(info) {
                    const selectedDate = info.dateStr;
                    document.getElementById('requestDate').value = selectedDate;
                    document.getElementById('bookingType').value = "Vereinsbuchung / Veranstalter";
                    
                    const formattedDate = new Date(selectedDate).toLocaleDateString('de-DE');
                    document.getElementById('badgeDateText').innerText = "Wunschdatum: " + formattedDate;
                    document.getElementById('selectedDateBadge').style.display = 'inline-flex';
                    
                    document.getElementById('booking-section').scrollIntoView({ behavior: 'smooth' });
                },

                // Klick auf ein bestehendes Event aus App/Datenbank
                eventClick: function(info) {
                    const title = info.event.title;
                    const eventDate = info.event.startStr.split('T')[0];
                    const props = info.event.extendedProps;

                    document.getElementById('eventTitleInput').value = title;
                    document.getElementById('requestDate').value = eventDate;
                    document.getElementById('bookingType').value = "Teilnahme an Veranstaltung";
                    
                    if (props.ort) {
                        document.getElementById('userNotes').value = "Ort: " + props.ort;
                    }

                    const formattedDate = new Date(eventDate).toLocaleDateString('de-DE');
                    document.getElementById('badgeDateText').innerText = title + " (" + formattedDate + ")";
                    document.getElementById('selectedDateBadge').style.display = 'inline-flex';

                    document.getElementById('booking-section').scrollIntoView({ behavior: 'smooth' });
                }
            });
            calendar.render();

            // 4. Formular Absenden an Supabase (event_bookings)
            const bookingForm = document.getElementById('eventBookingForm');
            if (bookingForm) {
                bookingForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const bookingType = document.getElementById('bookingType').value;
                    const reqDate = document.getElementById('requestDate').value;
                    const customTitle = document.getElementById('eventTitleInput').value;
                    const applicantName = document.getElementById('userName').value;
                    const email = document.getElementById('userEmail').value;
                    const count = parseInt(document.getElementById('ticketCount').value) || 1;
                    const userNotes = document.getElementById('userNotes').value;

                    const fullEventName = customTitle 
                        ? `[${bookingType}] ${customTitle} (Datum: ${reqDate})`
                        : `[${bookingType}] Datum: ${reqDate}`;

                    try {
                        const { data, error } = await supabaseClient
                            .from('event_bookings')
                            .insert([
                                { 
                                    event_name: fullEventName,
                                    applicant_name: applicantName,
                                    email: email,
                                    count: count,
                                    notes: userNotes,
                                    status: 'pending'
                                }
                            ]);

                        if (error) {
                            console.error("Supabase Fehler:", error);
                            alert('Fehler beim Senden: ' + error.message);
                        } else {
                            alert('Deine Anfrage wurde erfolgreich übermittelt!');
                            bookingForm.reset();
                            document.getElementById('selectedDateBadge').style.display = 'none';
                        }
                    } catch (err) {
                        console.error("Catch Fehler:", err);
                        alert('Ein unerwarteter Fehler ist aufgetreten.');
                    }
                });
            }
        });
    </script>
</body>
</html>
