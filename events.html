<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Aktionen – KrayFürAlle e.V.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; }
        .container { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
        .btn-primary { background: #2563eb; color: #fff; padding: 0.85rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Header-Modul -->
    <div data-include="components/navbar.html"></div>

    <main class="container">
        <h1 style="font-size: 2.2rem; color: #0f172a; margin-bottom: 0.5rem;">Aktionen & Veranstaltungskalender</h1>
        <p style="color: #64748b; margin-bottom: 2rem;">Hier findest du alle Termine in Kray. Buche deinen Platz direkt online!</p>

        <!-- Das Event- & Buchungsmodul wird per include.js geladen -->
        <div data-include="components/event-booking.html"></div>
    </main>

    <!-- Footer-Modul -->
    <div data-include="components/footer.html"></div>

    <!-- 1. Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Modul-Lader Script -->
    <script src="js/include.js"></script>

    <!-- 3. Formular-Handler mit Event Delegation -->
    <script>
        const SUPABASE_URL = 'https://ythubjdnercyeyfedsam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHViamRuZXJjeWV5ZmVkc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjgzNTgsImV4cCI6MjA5OTEwNDM1OH0.loeU2abylobRmPJvuHwdZLbHNyTL4qlKOtIRk-qZp34';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Event-Delegation: Reagiert auf allen Formularen auf der Seite, selbst wenn sie per fetch geladen wurden
        document.addEventListener('submit', async function(e) {
            // Prüfen, ob das abgeschickte Formular die ID 'eventBookingForm' hat
            if (e.target && e.target.id === 'eventBookingForm') {
                e.preventDefault();
                console.log("Formular abgesendet!");

                const eventName = document.getElementById('eventSelect').value;
                const applicantName = document.getElementById('userName').value;
                const email = document.getElementById('userEmail').value;
                const count = parseInt(document.getElementById('ticketCount').value) || 1;
                const notes = document.getElementById('userNotes').value;

                try {
                    const { data, error } = await supabaseClient
                        .from('event_bookings')
                        .insert([
                            { 
                                event_name: eventName,
                                applicant_name: applicantName,
                                email: email,
                                count: count,
                                notes: notes,
                                status: 'pending'
                            }
                        ]);

                    if (error) {
                        console.error("Supabase Fehler:", error);
                        alert('Fehler beim Senden: ' + error.message);
                    } else {
                        alert('Deine Teilnahme-Anfrage wurde erfolgreich abgesendet!');
                        e.target.reset();
                    }
                } catch (err) {
                    console.error("Catch Fehler:", err);
                    alert('Ein unerwarteter Fehler ist aufgetreten.');
                }
            }
        });
    </script>
</body>
</html>
