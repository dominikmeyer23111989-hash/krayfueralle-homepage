<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Termine – KrayFürAlle e.V.</title>
    <link rel="icon" href="data:,">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #334155; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        
        .header-title { font-size: 2.2rem; color: var(--text-main); margin-bottom: 0.5rem; font-weight: 700; }
        .header-subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem; }

        .card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 2rem; }
        
        /* FullCalendar Customizing */
        .fc { font-family: 'Inter', sans-serif; }
        .fc-toolbar-title { font-size: 1.3rem !important; font-weight: 600; color: var(--text-main); }
        .fc-button-primary { background-color: var(--primary-color) !important; border-color: var(--primary-color) !important; border-radius: 8px !important; }
        .fc-button-primary:hover { background-color: var(--primary-hover) !important; }
        .fc-event { cursor: pointer; border-radius: 6px; padding: 2px 5px; font-weight: 500; }

        /* Formular Styling */
        .btn-primary { background: var(--primary-color); color: #fff; padding: 0.85rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }

        .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1rem; }
        .form-group label { font-weight: 500; font-size: 0.9rem; color: var(--text-main); }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-color); }
        
        .selected-event-badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <!-- Header-Modul -->
    <div data-include="components/navbar.html"></div>

    <main class="container">
        <h1 class="header-title">Veranstaltungskalender & Anfragen</h1>
        <p class="header-subtitle">Klicke einfach auf einen Termin im Kalender, um Plätze zu reservieren oder eine Anfrage zu stellen.</p>

        <!-- 1. Interaktiver Kalender -->
        <div class="card">
            <h3 style="font-size: 1.3rem; color: var(--text-main); margin-top: 0; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-calendar-days" style="color: var(--primary-color); margin-right: 0.5rem;"></i>
                Terminübersicht
            </h3>
            <div id="calendar"></div>
        </div>

        <!-- 2. Buchungsformular -->
        <div class="card" id="booking-section">
            <h3 style="font-size: 1.3rem; color: var(--text-main); margin-top: 0; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-paper-plane" style="color: var(--primary-color); margin-right: 0.5rem;"></i>
                Veranstaltung buchen
            </h3>
            <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem;">Wähle oben im Kalender ein Event aus oder bestimme hier direkt die Details.</p>

            <div id="selectedBadge" class="selected-event-badge" style="display: none;">
                <i class="fa-solid fa-check"></i> Ausgewähltes Event: <span id="badgeEventName">-</span>
            </div>

            <form id="eventBookingForm" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div class="form-group">
                    <label for="eventSelect">Veranstaltung wählen:</label>
                    <select id="eventSelect" name="eventSelect" required autocomplete="off">
                        <option value="Stadtteiltreffen Kray">Stadtteiltreffen Kray</option>
                        <option value="Krayer Sommerfest 2026">Krayer Sommerfest 2026</option>
                        <option value="Digital-Sprechstunde">Digital-Sprechstunde für Senioren</option>
                        <option value="Krayer Repair-Café">Krayer Repair-Café</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label for="userName">Dein Name:</label>
                        <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Max Mustermann" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">E-Mail-Adresse:</label>
                        <input type="email" id="userEmail" name="userEmail" autocomplete="email" placeholder="max@example.de" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="ticketCount">Personen:</label>
                        <input type="number" id="ticketCount" name="ticketCount" autocomplete="off" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="userNotes">Anmerkung (optional):</label>
                        <input type="text" id="userNotes" name="userNotes" autocomplete="off" placeholder="z.B. Rollstuhlplatz, Kinderwagen">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">
                    <i class="fa-solid fa-paper-plane"></i> Teilnahme-Anfrage verbindlich absenden
                </button>
            </form>
        </div>
    </main>

    <!-- Footer-Modul -->
    <div data-include="components/footer.html"></div>

    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="js/include.js"></script>

    <!-- Script für Kalender & Supabase -->
    <script>
        const SUPABASE_URL = 'https://ythubjdnercyeyfedsam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHViamRuZXJjeWV5ZmVkc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjgzNTgsImV4cCI6MjA5OTEwNDM1OH0.loeU2abylobRmPJvuHwdZLbHNyTL4qlKOtIRk-qZp34';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Liste deiner Vereins-Termine
        const eventList = [
            { title: 'Stadtteiltreffen Kray', start: '2026-11-05T18:00:00', color: '#2563eb' },
            { title: 'Digital-Sprechstunde', start: '2026-11-12T15:00:00', color: '#0d9488' },
            { title: 'Krayer Repair-Café', start: '2026-11-20T14:00:00', color: '#d97706' },
            { title: 'Krayer Sommerfest 2026', start: '2026-12-01T12:00:00', color: '#dc2626' }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            // 2. FullCalendar Initialisieren
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'de',
                buttonText: { today: 'Heute' },
                events: eventList,
                eventClick: function(info) {
                    const title = info.event.title;
                    
                    // Dropdown anpassen
                    const eventSelect = document.getElementById('eventSelect');
                    if (eventSelect) {
                        // Prüfen, ob Option im Dropdown existiert
                        let exists = false;
                        for (let option of eventSelect.options) {
                            if (option.value === title) {
                                option.selected = true;
                                exists = true;
                                break;
                            }
                        }
                        // Wenn Option nicht existiert, kurz hinzufügen
                        if (!exists) {
                            const newOpt = document.createElement('option');
                            newOpt.value = title;
                            newOpt.text = title;
                            newOpt.selected = true;
                            eventSelect.add(newOpt);
                        }
                    }

                    // Hinweis-Badge aktualisieren & sanft zum Formular scrollen
                    document.getElementById('badgeEventName').innerText = title;
                    document.getElementById('selectedBadge').style.display = 'inline-block';
                    document.getElementById('booking-section').scrollIntoView({ behavior: 'smooth' });
                }
            });
            calendar.render();

            // 3. Formular Submit Handler für Supabase
            const bookingForm = document.getElementById('eventBookingForm');
            if (bookingForm) {
                bookingForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const eventName = document.getElementById('eventSelect').value;
                    const applicantName = document.getElementById('userName').value;
                    const email = document.getElementById('userEmail').value;
                    const count = parseInt(document.getElementById('ticketCount').value) || 1;
                    const notes = document.getElementById('userNotes').value;

                    try {
                        const { data, error } = await supabaseClient
                            .from('event_bookings')
                            .insert([
                                { 
                                    event_name: eventName,
                                    applicant_name: applicantName,
                                    email: email,
                                    count: count,
                                    notes: notes,
                                    status: 'pending'
                                }
                            ]);

                        if (error) {
                            console.error("Supabase Fehler:", error);
                            alert('Fehler beim Senden: ' + error.message);
                        } else {
                            alert('Deine Teilnahme-Anfrage für "' + eventName + '" wurde erfolgreich abgesendet!');
                            bookingForm.reset();
                            document.getElementById('selectedBadge').style.display = 'none';
                        }
                    } catch (err) {
                        console.error("Catch Fehler:", err);
                        alert('Ein unerwarteter Fehler ist aufgetreten.');
                    }
                });
            }
        });
    </script>
</body>
</html>
