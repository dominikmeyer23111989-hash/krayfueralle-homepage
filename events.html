<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Aktionen – KrayFürAlle e.V.</title>
    <!-- Favicon Platzhalter (verhindert den 404 Fehler, falls kein Favicon da ist) -->
    <link rel="icon" href="data:,">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome mit crossorigin Attribut, um Tracking-Blockaden zu minimieren -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; }
        .container { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
        .btn-primary { background: #2563eb; color: #fff; padding: 0.85rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Header-Modul -->
    <div data-include="components/navbar.html"></div>

    <main class="container">
        <h1 style="font-size: 2.2rem; color: #0f172a; margin-bottom: 0.5rem;">Aktionen & Veranstaltungskalender</h1>
        <p style="color: #64748b; margin-bottom: 2rem;">Hier findest du alle Termine in Kray. Buche deinen Platz direkt online!</p>

        <!-- Das Buchungsformular direkt eingebettet -->
        <div class="card" id="event-booking-module" style="background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
            <h3 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-calendar-check" style="color: #2563eb; margin-right: 0.5rem;"></i>
                Veranstaltung buchen & anfragen
            </h3>
            <p style="color: #64748b; margin-bottom: 1.5rem;">Wähle dein Event aus und sende eine Teilnahme-Anfrage. Die Bestätigung erfolgt direkt über unsere Vereins-App.</p>

            <form id="eventBookingForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label for="eventSelect" style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Veranstaltung wählen:</label>
                    <select id="eventSelect" name="eventSelect" required autocomplete="off" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                        <option value="Stadtteiltreffen Kray">Stadtteiltreffen Kray (Jeden 1. Donnerstag)</option>
                        <option value="Sommerfest 2026">Krayer Sommerfest 2026</option>
                        <option value="Digital-Sprechstunde">Digital-Sprechstunde für Senioren</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div>
                        <label for="userName" style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Dein Name:</label>
                        <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Max Mustermann" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                    </div>
                    <div>
                        <label for="userEmail" style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">E-Mail-Adresse:</label>
                        <input type="email" id="userEmail" name="userEmail" autocomplete="email" placeholder="max@example.de" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div>
                        <label for="ticketCount" style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Personen:</label>
                        <input type="number" id="ticketCount" name="ticketCount" autocomplete="off" min="1" value="1" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                    </div>
                    <div>
                        <label for="userNotes" style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Anmerkung (optional):</label>
                        <input type="text" id="userNotes" name="userNotes" autocomplete="off" placeholder="z.B. Rollstuhlplatz benötigt" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 0.5rem; justify-content: center; cursor: pointer;">
                    <i class="fa-solid fa-paper-plane"></i> Anfrage kostenfrei absenden
                </button>
            </form>
        </div>
    </main>

    <!-- Footer-Modul -->
    <div data-include="components/footer.html"></div>

    <!-- Supabase SDK & Include Modul-Lader -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/include.js"></script>

    <!-- Supabase Formular-Übertragung -->
    <script>
        const SUPABASE_URL = 'https://ythubjdnercyeyfedsam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHViamRuZXJjeWV5ZmVkc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjgzNTgsImV4cCI6MjA5OTEwNDM1OH0.loeU2abylobRmPJvuHwdZLbHNyTL4qlKOtIRk-qZp34';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const bookingForm = document.getElementById('eventBookingForm');
        if (bookingForm) {
            bookingForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log("Formular wird an Supabase gesendet...");

                const eventName = document.getElementById('eventSelect').value;
                const applicantName = document.getElementById('userName').value;
                const email = document.getElementById('userEmail').value;
                const count = parseInt(document.getElementById('ticketCount').value) || 1;
                const notes = document.getElementById('userNotes').value;

                try {
                    const { data, error } = await supabaseClient
                        .from('event_bookings')
                        .insert([
                            { 
                                event_name: eventName,
                                applicant_name: applicantName,
                                email: email,
                                count: count,
                                notes: notes,
                                status: 'pending'
                            }
                        ]);

                    if (error) {
                        console.error("Supabase Fehler:", error);
                        alert('Fehler beim Senden: ' + error.message);
                    } else {
                        alert('Deine Teilnahme-Anfrage wurde erfolgreich abgesendet!');
                        bookingForm.reset();
                    }
                } catch (err) {
                    console.error("Catch Fehler:", err);
                    alert('Ein unerwarteter Fehler ist aufgetreten.');
                }
            });
        }
    </script>
</body>
</html>
