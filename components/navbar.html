    /* Burger Toggle Button (Standard versteckt) */
    .nav-toggle {
        display: none;

        cursor: pointer;
        padding: 0.3rem;
    }

    /* Responsive Design für Mobilgeräte */
    @media (max-width: 868px) {
        .nav-toggle { display: block; }

        .nav-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #ffffff;
            flex-direction: column;
            align-items: flex-start;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-bottom: 1px solid #e2e8f0;
            gap: 1rem;
            box-sizing: border-box;
        }

        .nav-menu.active { display: flex; }
        .nav-btn-item { width: 100%; }
        .btn-nav-secondary, .btn-nav-primary { width: 100%; justify-content: center; }
    }
</style>

<script>
    // Universeller Event-Listener für das mobile Burger-Menü (funktioniert auch nach dem dynamischen Include)
    document.addEventListener('click', function(event) {
        const toggleBtn = event.target.closest('#navToggle');
        const navMenu = document.getElementById('navMenu');

        if (!navMenu) return;

        // Wenn auf den Burger-Button (oder das Icon darin) geklickt wird
        if (toggleBtn) {
            event.stopPropagation();
            navMenu.classList.toggle('active');
        } 
        // Wenn man außerhalb des Menüs klickt, während es offen ist -> Menü schließen
        else if (navMenu.classList.contains('active') && !navMenu.contains(event.target)) {
            navMenu.classList.remove('active');
        }
    });
</script>
