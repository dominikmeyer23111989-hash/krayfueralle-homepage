<div class="card" id="event-booking-module" style="background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
    <h3 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem;">
        <i class="fa-solid fa-calendar-check" style="color: #2563eb; margin-right: 0.5rem;"></i>
        Veranstaltung buchen & anfragen
    </h3>
    <p style="color: #64748b; margin-bottom: 1.5rem;">Wähle dein Event aus und sende eine Teilnahme-Anfrage. Die Bestätigung erfolgt direkt über unsere Vereins-App.</p>

    <form id="eventBookingForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Veranstaltung währen:</label>
            <select id="eventSelect" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
                <option value="Stadtteiltreffen Kray">Stadtteiltreffen Kray (Jeden 1. Donnerstag)</option>
                <option value="Sommerfest 2026">Krayer Sommerfest 2026</option>
                <option value="Digital-Sprechstunde">Digital-Sprechstunde für Senioren</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <div>
                <label style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Dein Name:</label>
                <input type="text" id="userName" placeholder="Max Mustermann" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">E-Mail-Adresse:</label>
                <input type="email" id="userEmail" placeholder="max@example.de" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
            <div>
                <label style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Personen:</label>
                <input type="number" id="ticketCount" min="1" value="1" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem;">Anmerkung (optional):</label>
                <input type="text" id="userNotes" placeholder="z.B. Rollstuhlplatz benötigt" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;">
            </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 0.5rem; justify-content: center; cursor: pointer;">
            <i class="fa-solid fa-paper-plane"></i> Anfrage kostenfrei absenden
        </button>
    </form>
</div>
